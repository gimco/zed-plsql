name = "PL/SQL"
grammar = "plsql"
path_suffixes = ["sql", "pls", "plb", "pks", "pkb", "pkh", "pck", "fnc", "prc", "trg", "tps", "tpb", "typ", "ddl"]
modeline_aliases = ["plsql", "pl/sql", "pls", "oracle"]
code_fence_block_name = "plsql"
line_comments = ["-- "]
block_comment = { start = "/*", end = "*/", prefix = " * ", tab_size = 1 }
tab_size = 2
hard_tabs = false
autoclose_before = ";:.,=}])>"
word_characters = ["$", "#", "_"]

brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]

# Fallback indent rules to complement tree-sitter.
# Handle incomplete structures (e.g. before typing `END`).
# Lines ending in `END LOOP` / `END CASE` must not open a block, so `loop`
# only counts when the line starts with `for` / `while` (or is bare `loop`).
increase_indent_pattern = "(?i)\\b(begin|declare|then|else|exception|is|as)\\s*(--.*)?$|^\\s*(for|while)\\b.*\\bloop\\s*(--.*)?$|^\\s*loop\\s*(--.*)?$"

# Fallback outdent rules to complement tree-sitter.
# Align `ELSE`/`ELSIF`/`EXCEPTION`/`END` with their block opener.
# `BEGIN` and `WHEN` are intentionally absent: tree-sitter indent ranges
# place them correctly, and a regex outdent would fight those ranges.
decrease_indent_pattern = "(?i)^\\s*(end|elsif|else|exception)\\b"
